name: BlockFrame
options:
  bundleIdPrefix: com.nulljosh
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.1"
    CURRENT_PROJECT_VERSION: "202608310815"

targets:
  BlockFrame-iOS:
    type: application
    # One target, two destinations (the pattern wordroot/ios/project.yml proves out) rather
    # than nimble's two separate targets — there are no platform-specific sources to exclude.
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nulljosh.wiretext
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # Was missing entirely, so no icon was assigned on EITHER platform — the app
        # shipped iconless and it only became obvious on the Mac build.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: QMM486NPYC
        CODE_SIGN_STYLE: Automatic
        # Without an entitlements file the signed bundle carries no
        # application-identifier while the embedded profile does — Apple rejects
        # that combination for TestFlight with ITMS-90886. Hand-committed rather
        # than generated via xcodegen `entitlements.properties` (drops keys).
        # BlockFrame.entitlements (was Wiretext.entitlements) existed since 08-03 but was never referenced here,
        # so xcodegen dropped it and every build shipped without it.
        CODE_SIGN_ENTITLEMENTS: BlockFrame.entitlements
        # Per-SDK, not one shared file: the iOS file's `application-identifier` is not a
        # valid macOS entitlement and makes Mac profile creation fail outright.
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: BlockFrame-macOS.entitlements

schemes:
  BlockFrame-iOS:
    build:
      targets:
        BlockFrame-iOS: all
    run:
      config: Debug
    archive:
      config: Release
    shared: true
